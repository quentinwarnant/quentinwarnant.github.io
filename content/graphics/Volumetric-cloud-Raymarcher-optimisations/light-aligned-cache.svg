<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="887" viewBox="50 60 920 680" role="img" aria-labelledby="title description">
  <title id="title">Light-aligned optical-depth cache</title>
  <desc id="description">A horizontal cloud is enclosed by a larger, diagonally oriented three-dimensional cache with slices perpendicular to the light vector. A green camera-ray sample reads optical depth along the orange path towards the sun. Orange sample markers appear only between that point and the light-facing boundary, not beyond the point.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#101e36"/>
      <stop offset="1" stop-color="#172b45"/>
    </linearGradient>
    <linearGradient id="cloud" x2="0.3" y2="1">
      <stop stop-color="#eff8ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#8ba9ca" stop-opacity=".23"/>
    </linearGradient>
    <linearGradient id="depth" x1="356" y1="264.5" x2="600" y2="447.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#e38b36"/>
    </linearGradient>
    <marker id="sun-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#ffd681" stroke-width="2"/>
    </marker>
    <marker id="camera-arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 8 4 0 8" fill="none" stroke="#74e4d3" stroke-width="2"/>
    </marker>
    <g id="cache-slice" stroke-linejoin="round">
      <path d="M0 0 150-200 260-165 110 35Z"/>
      <path d="m50-66.667 110 35 m-60-101.666 110 35 M55 17.5 205-182.5" fill="none" stroke-width="1"/>
    </g>
  </defs>
  <rect x="50" y="60" width="920" height="680" rx="20" fill="url(#background)"/>
  <g>
    <g fill="none" stroke="#ffd681" stroke-width="2.5">
      <circle cx="210" cy="155" r="25" fill="#ffd681" fill-opacity=".12"/>
      <path d="M210 114v-13 M210 196v13 M169 155H156 M251 155h13 M181 126l-10-10 M239 184l10 10 M181 184l-10 10 M239 126l10-10"/>
    </g>

    <g transform="matrix(1.29 -.12 -.12 1.36 -115.3 -104.1)" fill="#72bdf1" fill-opacity=".035" stroke="#74b8e4" stroke-width="1.5" stroke-linejoin="round">
      <path d="M270 380 420 180 740 420 590 620Z"/>
      <path d="M420 180 530 215 850 455 740 420Z"/>
      <path d="M270 380 380 415 700 655 590 620Z"/>
      <path d="M380 415 530 215 850 455 700 655Z"/>
    </g>

    <path d="M344 475C297 480 270 448 284 410C247 382 264 335 308 325C291 278 323 238 369 243C383 192 437 180 476 209C508 158 579 168 598 218C653 186 710 215 713 264C764 245 815 277 810 323C865 318 901 359 883 401C935 439 909 495 862 505C850 554 789 571 749 542C709 582 651 571 630 542C583 576 525 557 512 529C465 557 411 541 402 511C377 519 350 505 344 475Z" transform="matrix(.8 0 0 .55 80 170)" fill="url(#cloud)" stroke="#d4e7f8" stroke-opacity=".55" stroke-width="2"/>

    <g transform="matrix(1.29 -.12 -.12 1.36 -115.3 -104.1)">
      <g fill="#72bdf1" fill-opacity=".045" stroke="#86cafa" stroke-width="1.5">
        <use href="#cache-slice" transform="translate(270 380)"/>
        <use href="#cache-slice" transform="translate(350 440)"/>
        <use href="#cache-slice" transform="translate(510 560)"/>
        <use href="#cache-slice" transform="translate(590 620)"/>
      </g>
      <g fill="none" stroke="#86cafa" stroke-width="1" opacity=".45">
        <path d="M320 313.333 640 553.333 M370 246.667 690 486.667 M325 397.5 645 637.5 M475 197.5 795 437.5 M430 348.333 750 588.333 M480 281.667 800 521.667"/>
      </g>
      <use href="#cache-slice" transform="translate(430 500)" fill="#72bdf1" fill-opacity=".12" stroke="#99d9ff" stroke-width="3"/>
    </g>

    <path d="M600 447.5 356 264.5" stroke="url(#depth)" stroke-width="22" stroke-linecap="butt" opacity=".3"/>
    <path d="M600 447.5 356 264.5 260 192.5" fill="none" stroke="url(#depth)" stroke-width="5" stroke-linecap="round" marker-end="url(#sun-arrow)"/>
    <g fill="#ffd681" stroke="#172b45" stroke-width="2">
      <circle cx="404" cy="300.5" r="5"/>
      <circle cx="500" cy="372.5" r="5"/>
    </g>

    <g stroke="#74e4d3" fill="none" stroke-width="3">
      <path d="M142 572 600 447.5" marker-end="url(#camera-arrow)"/>
      <path d="M600 447.5 850 379.54" stroke-dasharray="8 8" opacity=".8"/>
      <rect x="88" y="555" width="42" height="31" rx="5" fill="#183c48"/>
      <path d="m130 563 12-7v30l-12-7Z" fill="#183c48"/>
    </g>
    <circle cx="600" cy="447.5" r="11" fill="#74e4d3" stroke="#102033" stroke-width="3"/>
  </g>
</svg>
